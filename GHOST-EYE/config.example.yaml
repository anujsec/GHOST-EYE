# Nothing here is required for normal use — `python recon.py example.com` works
# with zero config. This file only exists to override defaults (wordlists for
# brute force / content discovery, a validated resolver list, notification
# webhooks, or concurrency tuning).
#
# Copy to config.yaml if you want to override anything:
#   cp config.example.yaml config.yaml

mode: fast

concurrency:
  discovery_workers: 5      # crt.sh / subfinder / amass / gau / waybackurls in-flight at once
  dns_workers: 20           # informs dnsx batch timeout sizing
  http_workers: 20          # parallel httpx probing
  js_workers: 10            # parallel JS fetch+analyze workers
  content_workers: 5        # parallel ffuf/feroxbuster workers (deep mode only)
  port_workers: 5           # parallel naabu port scanning (deep mode only)

discovery:
  passive: true
  expensive_pivots: false          # ASN + amass org intel — slow, off unless --deep
  brute_force: false               # puredns bruteforce — needs wordlists.subdomains + resolvers.validated
  permutations: false              # alterx — needs resolvers.validated
  recursive_permutations: false    # one extra alterx pass on resolved permutations

httpx:
  mode: fast    # fast: status/title/tech/server/length/redirect. deep: + cdn/cname/hash/favicon/tls

url_discovery:
  katana_depth_fast: 1
  katana_depth_deep: 3
  js_cap_fast: 150      # max JS files analyzed per run in fast mode
  js_cap_deep: 1000
  historical_sources: [gau, waybackurls]  # add wamore to include its archive results
  normalize_with_uro: true                # uses uro when installed; otherwise basic normalization

javascript:
  jsluice: false       # additional JS analysis; requires jsluice
  trufflehog: false    # run trufflehog on downloaded JS bundles
  source_maps: false   # fetch JS bundles to discover source map URLs

parameter_discovery:
  enabled: false       # active parameter probing with Arjun
  max_urls: 10
  timeout: 300

content_discovery:
  enabled: false     # ffuf/feroxbuster — off by default, on with --deep, bounded to max_hosts
  max_hosts: 10
  timeout: 300
  tool: feroxbuster  # ffuf (faster) or feroxbuster (more options)

port_discovery:
  enabled: false     # naabu port scanning — off by default, on with --deep
  max_hosts: 50      # limit concurrent targets
  timeout: 600
  service_detection: false  # nmap service detection (very slow, only with --deep --service-detect)

local_scans:
  gitleaks_path: null          # optional local directory to scan for secrets
  s3_bucket_names_file: null   # optional candidate-bucket list for s3scanner

screenshots:
  enabled: false     # gowitness — off by default, on with --screenshots, runs async/non-blocking
  max_hosts: 20

nuclei:
  enabled: true
  rate_limit: 50      # respect target rules of engagement — don't raise this blindly
  concurrency: 25
  timeout: 1800

cache:
  enabled: true
  dns_ttl: 3600            # 1h  — dnsx results
  passive_ttl: 21600       # 6h  — crt.sh results
  url_history_ttl: 86400   # 24h — gau/waybackurls results

wordlists:
  subdomains: null   # e.g. /opt/wordlists/n0kovo_subdomains.txt — required for --bruteforce/--deep
  content: null       # e.g. /opt/wordlists/raft-medium-directories.txt — required for content_discovery

resolvers:
  raw: null         # optional raw list; set validate_on_run to run dnsvalidator
  validated: null    # output of dnsvalidator — required for brute_force/permutations
  validate_on_run: false

notifications:
  slack_webhook: ""      # https://hooks.slack.com/services/...
  discord_webhook: ""    # https://discord.com/api/webhooks/...
  telegram_bot_token: ""
  telegram_chat_id: ""

# API keys for subfinder/amass are picked up from their own config files
# (~/.config/subfinder/provider-config.yaml, ~/.config/amass/config.ini),
# not duplicated here — more keys there = dramatically better passive coverage.
